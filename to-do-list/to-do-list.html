<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do-list</title>
    <link rel="stylesheet" href="to-do-list.css">
</head>

<body>
    <div class="bg-pattern"></div>


    <div class="navbar">
        <div class="about">
            <h3>about</h3>
        </div>
        <div class="github"><img src="github.png" alt=""></div>
    </div>


    <div class="main">
        <div class="todo-logo">
            <img src="todotrans.jpg" alt="">
        </div>

        <div class="text-content">
            <input id="task" type="text" placeholder="ENTER YOUR TO-DO TASK">

            <button class="Add-btn">Add +</button>
        </div>


        <div class="container-main">
            <div class="to-do-list-container">
                <div class="container-nav">
                    <input class="mark-all-btn" type="button" value="MARK ALL DONE">
                    <div class="navtext">
                        <p>ACT NOW, CLEAR GOALS</p>
                    </div>
                </div>
                <ul class="todo-content">
                    <li  id="todo-item" draggable="true">

                        
                    </li>
                    
                    <li class="todo-item" id="todo-item" draggable="true">

                        <div class="complete"><span class="tick">✔</span></div>
                        <div class="todo-task">this is task 333</div>
                        <div class="delete"><span class="cross">✘</span></div>
                    </li>

                    

                </ul>

                <div class="footer"> 2 items remaining</div>
            </div>


            <div class="sidebar">
                <ul class="sidebar-ul">
                    <li id="sidebar-header">
                        <p>SIDEBAR</p>
                    </li>
                    <li id="clear">
                        <input class="clear-all" type="button" value=" clear all">
                    </li>
                    <li>
                        <input id="finish-all" type="button" value="FINISH ALL">
                    </li>
                    <li>
                        <input id="Trash" type="button" value="Trash">
                    </li>
                </ul>
            </div>
        </div>
    </div>



    <script src="to-do-list.js"></script>
    <script src="to-do.js"></script>
</body>

</html>
