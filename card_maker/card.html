<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card creator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background-color: rgb(40, 39, 39);
        }

        .main{
            padding: 30px;
            margin: 10px;
        }

        input {
            display: flex;
            margin: 5px;
        }
        .card{
            border: 2px solid rgb(67, 67, 67);
            max-width: 350px;
            min-height: 170px;
            max-height: auto;
            padding: 9px;
            border-radius: 10px 2px;
            background-color: rgb(153, 52, 39);

            
        }
        .profile{
            border: 2px solid black;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background-color: rebeccapurple;
            margin-top: 6px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2{
            margin-top: 5px;
            font-weight: bolder;
            color: whitesmoke;
        }
        h4{
            color: whitesmoke;
            margin-top: 7px;
            font-weight: bolder;

        }
        p{
            color: whitesmoke;
            margin-top: 10px;
            font-weight:lighter ;
        }

    </style>
</head>

<body>
    <div class="main">

        <form action="">
            
            <input type="text" placeholder="profile pic">
            <input type="name" placeholder="name">
            <input type="email" placeholder="Example@gmail.com">
            <input type="text" placeholder="info">
            <input type="submit">
            
        </form>

</html>
